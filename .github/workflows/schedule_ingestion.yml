name: Daily Data Ingestion Scheduler

on:
  schedule:
    # Runs at 10:30 AM IST (05:00 UTC) every day
    - cron: '0 5 * * *'
  # Also allows manual triggering from the GitHub Actions UI
  workflow_dispatch:

jobs:
  update-vector-db:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Data Ingestion Pipeline
      run: |
        python ingest.py

    - name: Commit and Push Updated ChromaDB
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add chroma_db/ data/
        # Check if there are any changes before committing
        if ! git diff-index --quiet HEAD; then
          git commit -m "chore: automated daily vector database sync"
          git push
        else
          echo "No changes in source data, vector database is already up to date."
        fi
